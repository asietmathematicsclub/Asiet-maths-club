[build]
  publish = "public"

# Redirects for API and Uploads to the Render backend
# IMPORTANT: Replace the URL below with your actual Render deployment URL
[[redirects]]
  from = "/api/*"
  to = "https://your-render-app-name.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://your-render-app-name.onrender.com/uploads/:splat"
  status = 200
  force = true

# Fallback for Single Page Application routing (if needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
